name: Frontend CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy this main revision to production after tests'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main workflow while it is mutating the server.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend-build:
    name: Frontend Docker and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build frontend image with locked dependencies
        run: |
          bash -n scripts/deploy-ci.sh
          docker build --tag frontend-ci .
      - name: Compile production frontend
        run: docker run --rm frontend-ci npm run build
      - name: Run all frontend tests
        run: docker run --rm frontend-ci npm test
      - name: Build production image
        run: docker build --file Dockerfile.production --tag frontend-production-ci .
      - name: Validate Caddy configuration
        run: docker run --rm frontend-production-ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Test static server and API routing
        run: |
          set -euo pipefail
          docker run -d --name frontend-production-smoke -p 127.0.0.1:18080:8080 frontend-production-ci
          trap 'docker logs frontend-production-smoke; docker rm -f frontend-production-smoke' EXIT
          curl --retry 15 --retry-all-errors --retry-delay 1 --connect-timeout 2 --max-time 5 --fail http://127.0.0.1:18080/healthz
          curl --fail http://127.0.0.1:18080/ | grep -q '<div id="root"'
          curl --fail http://127.0.0.1:18080/login | grep -q '<div id="root"'
          # No backend is running: API must fail as API, never return SPA HTML.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/health)" = 502

  required-checks:
    name: Frontend required checks
    if: always()
    needs: frontend-build
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.frontend-build.result }}
        run: test "$RESULT" = success

  publish:
    name: Publish frontend image
    needs: required-checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.image.outputs.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build and publish versioned image
        id: image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          docker build --file Dockerfile.production --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$image" .
          docker run --rm "$image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run -d --name frontend-release-smoke -p 127.0.0.1:18080:8080 "$image"
          trap 'docker rm -f frontend-release-smoke; docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          curl --retry 15 --retry-all-errors --retry-delay 1 --connect-timeout 2 --max-time 5 --fail http://127.0.0.1:18080/healthz
          curl --fail http://127.0.0.1:18080/ | grep -q '<div id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/health)" = 502
          docker rm -f frontend-release-smoke
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          docker pull "$image"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          printf 'image=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '### Frontend image\nCommit: `%s`\n\n`%s`\n' "$GITHUB_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy frontend
    needs: publish
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Deploy exact published digest
        env:
          COMPONENT: frontend
          IMAGE: ${{ needs.publish.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/deploy-ci.sh
