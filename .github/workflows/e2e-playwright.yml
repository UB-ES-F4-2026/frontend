name: E2E Playwright Tests

on:
  # DESCOMENTAR SI CAL PROVAR LA GITHUB ACTION SENSE FER PR A DEV
  # push:
  #   branches:
  #     - e2e-testing
  pull_request:
    branches:
      - dev

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 20
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout del código del frontend (tu Pull Request)
      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      # 2. Checkout del código del backend
      - name: Checkout Backend
        uses: actions/checkout@v4
        with:
          repository: UB-ES-F4-2026/backend
          path: backend
          ref: dev

      # 3. Preparar entorno para Docker Compose
      - name: Setup Environment
        run: |
          cd backend
          echo "POSTGRES_DB=test_db" >> .env
          echo "POSTGRES_USER=test_user" >> .env
          echo "POSTGRES_PASSWORD=test_password" >> .env
          echo "POSTGRES_PORT=5432" >> .env
          echo "BACKEND_PORT=8000" >> .env
          echo "FRONTEND_PORT=5173" >> .env
          echo "PGADMIN_PORT=5050" >> .env
          echo "PGADMIN_DEFAULT_EMAIL=admin@f4.local" >> .env
          echo "PGADMIN_DEFAULT_PASSWORD=admin" >> .env
          # La clave maestra para el compose: apuntar al clon del frontend
          echo "FRONTEND_PATH=../frontend" >> .env

      # 4. Levantar la infraestructura efímera
      - name: Start Ephemeral Stack
        run: |
          cd backend
          # Levantamos db, backend y frontend. Ignoramos pgadmin porque Playwright no lo necesita.
          docker compose up -d db backend frontend --build
      
      # 5. Esperar a que los healthchecks pasen y el stack esté estable
      - name: Wait for Stack Health
        run: |
          cd backend
          echo "Waiting for backend to be healthy..."
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q backend))
            if [ "$STATUS" == "healthy" ]; then
              echo "Backend is healthy!"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 3
          done

          echo "Waiting for frontend to be healthy..."
          for i in {1..30}; do
            FRONTEND_STATUS=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q frontend))
            if [ "$FRONTEND_STATUS" == "healthy" ]; then
              echo "Frontend is healthy!"
              break
            fi
            if [ "$i" == "30" ]; then
              echo "Frontend did not become healthy in time."
              docker compose logs frontend
              exit 1
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 3
          done

      # 6. Ejecutar migraciones y semilla (Seed) de datos
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          cd backend
          pip install httpx psycopg2-binary
          
      - name: Run Migrations and Seed Data
        run: |
          cd backend
          python seed_e2e_testing_data.py

      # 7. Instalar dependencias de Playwright en el runner (directamente en la carpeta frontend)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps

      # 8. Ejecutar tests exportando JSON y HTML
      - name: Run E2E Tests
        run: |
          cd frontend
          PLAYWRIGHT_JSON_OUTPUT_NAME=results.json PLAYWRIGHT_BASE_URL=http://127.0.0.1:5173 npx playwright test --workers=1 --reporter=line,github,html,json

      # 9. Subir el reporte a Surge (Solo si es una Pull Request)
      - name: Deploy Report to Surge
        if: always() && github.event_name == 'pull_request'
        run: |
          npm install -g surge
          surge ./frontend/playwright-report f4-e2e-pr-${{ github.event.number }}.surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}

      # 10. Leer el JSON, armar la tabla en Markdown y comentar en la PR
      - name: Post PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Leemos los resultados del JSON de Playwright
            const resultsPath = './frontend/playwright-report/results.json';
            if (!fs.existsSync(resultsPath)) {
              console.log("No se encontró el archivo JSON. Omitiendo comentario.");
              return;
            }
            
            const results = JSON.parse(fs.readFileSync(resultsPath));
            const stats = results.stats || {};
            const passed = stats.expected || 0;
            const failed = stats.unexpected || 0;
            const flaky = stats.flaky || 0;
            const duration = ((stats.duration || 0) / 1000).toFixed(1);
            
            const reportUrl = `https://f4-e2e-pr-${context.issue.number}.surge.sh`;
            
            // Construimos la tabla Markdown
            let body = `### 🎭 Resultados E2E de Playwright\n\n`;
            body += `| Estado | Cantidad |\n`;
            body += `|---|---|\n`;
            body += `| ✅ **Pasados** | ${passed} |\n`;
            body += `| ❌ **Fallados** | ${failed} |\n`;
            body += `| ⚠️ **Inestables** | ${flaky} |\n`;
            body += `| ⏱️ **Tiempo total** | ${duration}s |\n\n`;
            
            // Mensaje condicional con el link
            if (failed > 0) {
              body += `🚨 **¡Hay errores!** 🔍 [Abre el reporte interactivo para ver los detalles y las trazas](${reportUrl})`;
            } else {
              body += `✨ **¡Todo en verde!** 🟢 [Ver reporte completo](${reportUrl})`;
            }
            
            // Publicar el comentario en la PR
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          
      # 10. Limpiar contenedores (Opcional en GitHub Actions, pero buena práctica)
      - name: Teardown
        if: always()
        run: |
          cd backend
          docker compose down -v