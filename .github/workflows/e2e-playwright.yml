name: E2E Playwright Tests

on:
  push:
    branches:
      - e2e-testing
  pull_request:
    branches:
      - dev

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 20
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout del código del frontend (tu Pull Request)
      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      # 2. Checkout del código del backend
      # Intenta hacer checkout de la rama con el mismo nombre que la PR. 
      # Si no existe, hace un fallback a la rama 'dev'.
      - name: Checkout Backend
        id: checkout_backend
        uses: actions/checkout@v4
        with:
          repository: UB-ES-F4-2026/backend
          path: backend
          ref: ${{ github.head_ref }}
        continue-on-error: true
      
      - name: Fallback Checkout Backend to dev
        if: steps.checkout_backend.outcome != 'success'
        uses: actions/checkout@v4
        with:
          repository: UB-ES-F4-2026/backend
          path: backend
          ref: dev

      # 3. Preparar entorno para Docker Compose
      - name: Setup Environment
        run: |
          cd backend
          echo "POSTGRES_DB=test_db" >> .env
          echo "POSTGRES_USER=test_user" >> .env
          echo "POSTGRES_PASSWORD=test_password" >> .env
          echo "POSTGRES_PORT=5432" >> .env
          echo "BACKEND_PORT=8000" >> .env
          echo "FRONTEND_PORT=5173" >> .env
          echo "PGADMIN_PORT=5050" >> .env
          echo "PGADMIN_DEFAULT_EMAIL=admin@f4.local" >> .env
          echo "PGADMIN_DEFAULT_PASSWORD=admin" >> .env
          # La clave maestra para el compose: apuntar al clon del frontend
          echo "FRONTEND_PATH=../frontend" >> .env

      # 4. Levantar la infraestructura efímera
      - name: Start Ephemeral Stack
        run: |
          cd backend
          # Levantamos db, backend y frontend. Ignoramos pgadmin porque Playwright no lo necesita.
          docker compose up -d db backend frontend --build
      
      # 5. Esperar a que los healthchecks pasen y el stack esté estable
      - name: Wait for Stack Health
        run: |
          cd backend
          echo "Waiting for services to be healthy..."
          # Un loop sencillo para no avanzar hasta que el backend (y por dependencia, la BD) estén OK
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q backend))
            if [ "$STATUS" == "healthy" ]; then
              echo "Backend is healthy!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 3
          done
          # Nos aseguramos de que el frontend también reporte healthy
          FRONTEND_STATUS=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q frontend))
          if [ "$FRONTEND_STATUS" != "healthy" ]; then
            echo "Frontend did not become healthy."
            docker compose logs frontend
            exit 1
          fi

      # 6. Ejecutar migraciones y semilla (Seed) de datos
      # Esto asume que tienes un script o comando en el backend para popular la BD base.
      - name: Run Migrations and Seed Data
        run: |
          cd backend
          # Alembic suele ejecutarse al arrancar si tienes el entrypoint configurado para ello. 
          # Si no, lo fuerzas: docker compose exec -T backend alembic upgrade head
          
          # ¡AQUÍ DEBES INCLUIR TU SCRIPT DE SEED! Ejemplo:
          # docker compose exec -T backend python -m app.scripts.seed_db

      # 7. Instalar dependencias de Playwright en el runner (directamente en la carpeta frontend)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps

      # 8. Ejecutar los tests (atacando a localhost:5173, expuesto por el compose)
      - name: Run E2E Tests
        run: |
          cd frontend
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:5173 npx playwright test

      # 9. Guardar reportes para debuggear (Artifacts)
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          
      # 10. Limpiar contenedores (Opcional en GitHub Actions, pero buena práctica)
      - name: Teardown
        if: always()
        run: |
          cd backend
          docker compose down -v